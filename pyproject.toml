[project]
name = "isaac-gs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # RL
    "gymnasium>=1.3.0",
    # 実験ログ
    "wandb>=0.27.0",
    # 画像処理
    "Pillow>=10.0.0",
    # コンフィグ管理
    "pydantic>=2.0",
    # プログレスバー
    "tqdm>=4.0",
    # 動画書き出し
    "opencv-python>=4.0",
    # 視覚エンコーダ(models/sac_DINOv3/でDINOv3を読み込むため)
    "transformers>=4.56.0",
]

# IsaacSim と PyTorch は setup.sh で別途インストール

[tool.uv]
managed = false

[tool.setuptools.packages.find]
include = ["envs*", "models*", "stage_generation*", "utils*"]
