[project]
name = "isaac-gs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # RL
    "gymnasium>=1.3.0",
    # 実験ログ
    "wandb>=0.27.0",
    # 画像処理（deploy.py で使用）
    "Pillow>=10.0.0",
    # コンフィグ管理
    "pydantic>=2.0",
    # プログレスバー
    "tqdm>=4.0",
    # 動画書き出し（utils/recorder.py で使用）
    "opencv-python>=4.0",
]

# IsaacSim と PyTorch は setup.sh で別途インストール（バージョン競合を避けるため）

[tool.uv]
# IsaacSim は別 venv (~/.venv/env_Isaac-GS) に手動インストールしており uv.lock に含まれない。
# managed=false で uv run の自動 sync を無効化し、既存環境が prune されるのを防ぐ。
# 併せて .venv を ~/.venv/env_Isaac-GS へのシンボリックリンクにすることで、
# `source activate` なしに `uv run xxx.py` が IsaacSim 入り環境で実行できる（setup.sh 参照）。
managed = false

[tool.setuptools.packages.find]
include = ["envs*", "models*", "stage_generation*", "utils*"]
